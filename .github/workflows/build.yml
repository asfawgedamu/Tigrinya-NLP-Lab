name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Reports known issues without failing the build. The one open advisory (@grpc/grpc-js inside firebase)
      # sits in Firebase's Node-only code and is not part of the browser bundle.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
